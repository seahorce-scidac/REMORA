name: REMORA PnetCDF

on:
  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-pnetcdf
  cancel-in-progress: true

env:
  PNETCDF_VERSION: 1.14.0

jobs:

  Build-And-Test-PnetCDF:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    # The install must sit outside the source tree: CMake rejects imported include
    # directories inside it.
    - name: Set PnetCDF install prefix
      run: echo "PNETCDF_PREFIX=${{ runner.temp }}/pnetcdf-install" >> $GITHUB_ENV

    - name: Install MPI
      run: |
        sudo apt-get update
        sudo apt-get install -y mpich libmpich-dev pkg-config m4

    # PnetCDF is built from source so it links the same MPI (mpich) as REMORA.
    # Ubuntu's libpnetcdf-dev is built against OpenMPI.
    - name: Cache PnetCDF
      id: cache-pnetcdf
      uses: actions/cache@v6
      with:
        path: ${{ env.PNETCDF_PREFIX }}
        key: pnetcdf-${{ env.PNETCDF_VERSION }}-mpich-${{ runner.os }}

    - name: Build PnetCDF
      if: steps.cache-pnetcdf.outputs.cache-hit != 'true'
      run: |
        cd ${{ runner.temp }}
        curl -fsSL -o pnetcdf.tar.gz \
          https://parallel-netcdf.github.io/Release/pnetcdf-${PNETCDF_VERSION}.tar.gz
        tar xzf pnetcdf.tar.gz
        cd pnetcdf-${PNETCDF_VERSION}
        # The PnetCDF utilities declare enum constants named true and false, which are
        # keywords in C23, the default C standard of the runner's GCC.
        ./configure --prefix=${PNETCDF_PREFIX} \
          --disable-fortran --disable-cxx --enable-shared \
          CC=mpicc CFLAGS="-O2 -std=gnu17"
        make -j $(nproc)
        make install

    - name: Point the build at PnetCDF
      run: |
        echo "PKG_CONFIG_PATH=${PNETCDF_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${PNETCDF_PREFIX}/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
        echo "PATH=${PNETCDF_PREFIX}/bin:${PATH}" >> $GITHUB_ENV

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Configure CMake
      run: |
        cmake \
          -B${{runner.workspace}}/REMORA/build-pnetcdf \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DREMORA_DIM:STRING=3 \
          -DREMORA_ENABLE_MPI:BOOL=ON \
          -DREMORA_ENABLE_PNETCDF:BOOL=ON \
          -DREMORA_ENABLE_TESTS:BOOL=ON \
          -DREMORA_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DREMORA_ENABLE_FCOMPARE:BOOL=ON \
          ${{github.workspace}}

    - name: Build
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=600M
        ccache -z

        cmake \
          --build ${{runner.workspace}}/REMORA/build-pnetcdf \
          --parallel $(nproc) \
          2>&1 | tee -a ${{runner.workspace}}/build-output.txt

        ccache -s
        du -hs ~/.cache/ccache

    - name: Report
      run: |
        egrep "warning:|error:" ${{runner.workspace}}/build-output.txt \
          | egrep -v -i "Submodules/amrex" | egrep -v "lto-wrapper: warning:" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: Regression Tests
      run: |
        ctest -L regression --output-on-failure
      working-directory: ${{runner.workspace}}/REMORA/build-pnetcdf
